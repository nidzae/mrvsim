key: ghgsat_av
name: GHGSat-AV airborne imaging spectrometer (aircraft)
class: aircraft
tier: A                          # [elabbadi2024]
enabled_for_certification: true
observation_mode: snapshot
spatial_scope: site
schedule: campaign
pod:
  pod50_kg_h: 5.0                # El Abbadi 2024 (140 filtered releases): smallest detected 2.91 kg/h; "detected emissions below 5 kg/h";
  pod90_kg_h: 20.0               #   largest missed 29.17 kg/h with three false negatives in the 15-30 kg/h range [elabbadi2024]
  gamma: 1.0
  u_ref_m_s: 3.0
  surface_adjustment: {enabled: true, rho_ref: 0.30, rho_p10: 0.12, phi_at_p10: 0.5, uncertainty_halfwidth: 0.5}
  citations: [elabbadi2024]
  provenance: {status: summary, basis: "bracketed by El Abbadi 2024's smallest detected (2.91 kg/h) and the 15-30 kg/h false negatives; not a fit to the release table"}
quantification:
  ratio_95_low: 0.40
  ratio_95_high: 1.90
  tier: A
  citations: [elabbadi2024]
  provenance: {status: summary, basis: "El Abbadi 2024 parity slope 0.76, R^2 0.93 (121 estimates); generic aircraft spread"}
false_positive:
  rate_per_opportunity: 0.01
  reported_rate_quantile_max: 0.25
  citations: [elabbadi2024]
  provenance: {status: assumption, basis: "zero false positives in 63 zero releases (El Abbadi 2024); 1 % field allowance"}
constraints:
  max_wind_m_s: 10.0
  max_solar_zenith_deg: null
  max_cloud_fraction: 0.6
  day_only: true
cost:
  per_site_visit_usd: 400.0      # TODO(verify) [cost-assumptions]
  per_tasking_usd: null
  per_site_year_usd: null
  citations: [cost-assumptions]
  provenance: {status: assumption, basis: "analyst placeholder"}
