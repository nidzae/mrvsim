key: bridger_gml
name: Bridger Photonics Gas Mapping LiDAR (aircraft)
class: aircraft
tier: A                          # TDD section 4 table: [sherwin2021; elabbadi2024; chen2024]
enabled_for_certification: true
observation_mode: snapshot
spatial_scope: site              # TDD section 4.3: aircraft resolve the facility total
schedule: campaign
pod:
  pod50_kg_h: 1.0                # Johnson et al. 2021: field sensitivity ~1 kg/h; all releases above 2 kg/h detected [johnson2021]
  pod90_kg_h: 3.0                # Johnson et al. 2021: >90 % POD at 3 kg/h under typical conditions [johnson2021]
  gamma: 1.0                     # TDD section 4.1 default for imaging sensors
  u_ref_m_s: 3.0
  surface_adjustment: {enabled: false}   # active LiDAR, not passive SWIR
  citations: [johnson2021]
  provenance: {status: summary, basis: "POD90 = 3 kg/h (>90 % POD, typical conditions) and ~1 kg/h field sensitivity from the Johnson, Tyner & Szekeres 2021 blinded evaluation (29 releases, 22 sites); not a fit to the release table"}
quantification:
  ratio_95_low: 0.359            # Bridger 95 % uncertainty interval -64.1 % to +87.0 % as quoted by Daniels et al. 2023 [daniels2023]
  ratio_95_high: 1.870
  tier: A
  citations: [daniels2023, johnson2021]
  provenance: {status: summary, basis: "beta, sigma derived from the published 95 % interval [-64.1 %, +87.0 %] (Daniels et al. 2023, citing Bridger's blind-test results)"}
false_positive:
  rate_per_opportunity: 0.01     # El Abbadi 2024: no false positives in 63 zero releases across five aircraft platforms [elabbadi2024]; 1 % kept as a conservative field allowance
  reported_rate_quantile_max: 0.25
  citations: [elabbadi2024]
  provenance: {status: assumption, basis: "blind tests (El Abbadi 2024) produced zero false positives; 1 % per site pass is a conservative field allowance"}
constraints:
  max_wind_m_s: 10.0
  max_solar_zenith_deg: null
  max_cloud_fraction: 0.8        # flies under cloud; only low ceilings ground it (looser than satellites, TDD section 5.2)
  day_only: true
cost:
  per_site_visit_usd: 600.0      # TODO(verify) [cost-assumptions]
  per_tasking_usd: null
  per_site_year_usd: null
  citations: [cost-assumptions]
  provenance: {status: assumption, basis: "analyst placeholder per site pass in a basin-scale campaign"}
footprint:
  survey_block_km: 0.5           # TODO(verify) ASSUMPTION: a site survey images a ~0.5 km block around the target; neighbours inside are seen incidentally [survey-footprint-assumption]
  citations: [survey-footprint-assumption]
  provenance: {status: assumption, basis: "analyst assumption for the flown block around a site; replace with operator flight plans"}
