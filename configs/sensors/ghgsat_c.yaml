key: ghgsat_c
name: GHGSat-C constellation (tasked point-source imager)
class: satellite
tier: A                          # [sherwin2023]; small blind sample, (a, b) uncertainty propagated (TDD section 4.1 note)
enabled_for_certification: true
observation_mode: snapshot
spatial_scope: site
schedule: orbit
pod:
  pod50_kg_h: 150.0              # TODO(verify) [sherwin2023]
  pod90_kg_h: 300.0              # TODO(verify); POD90/POD50 = 2: blind tests saw no detections well below the limit
  gamma: 1.0
  u_ref_m_s: 3.0
  ab_cov: [[0.25, -0.04], [-0.04, 0.01]]   # ASSUMPTION standing in for the Laplace posterior until fitted (TDD section 4.1 sample-size note)
  surface_adjustment: {enabled: true, rho_ref: 0.30, rho_p10: 0.12, phi_at_p10: 0.5, uncertainty_halfwidth: 0.5}
  citations: [sherwin2023]
  provenance: {status: summary, basis: "detection limit recalled from Sherwin et al. 2023 single-blind satellite test; replace with fit"}
quantification:
  ratio_95_low: 0.40
  ratio_95_high: 1.90
  tier: A
  citations: [sherwin2023]
  provenance: {status: summary, basis: "satellite quantification error comparable to aircraft per Sherwin 2023; TODO(verify)"}
false_positive:
  rate_per_opportunity: 0.02
  reported_rate_quantile_max: 0.25
  citations: [sherwin2023]
  provenance: {status: assumption, basis: "2 % per scene assumed"}
constraints:
  max_wind_m_s: 8.0
  max_solar_zenith_deg: 70.0     # TDD section 5.2
  max_cloud_fraction: null       # cloud gate is the Bernoulli draw on p_cloud (TDD section 5.2)
  day_only: true
orbit:
  tle_name: GHGSAT-C2            # CelesTrak name, confirmed 2026-09-30 [celestrak]
  norad_id: 47509                # confirmed from CelesTrak 2026-09-30 [celestrak]
  swath_km: 12.0
  tasked: true
  local_time_desc: "~10:30 descending (sun-synchronous)"
  citations: [celestrak, sherwin2023]
cost:
  per_site_visit_usd: null
  per_tasking_usd: 3000.0        # TODO(verify) [cost-assumptions]
  per_site_year_usd: null
  citations: [cost-assumptions]
  provenance: {status: assumption, basis: "analyst placeholder per tasked scene"}
