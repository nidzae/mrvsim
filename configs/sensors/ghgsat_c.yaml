key: ghgsat_c
name: GHGSat-C constellation (tasked point-source imager)
class: satellite
tier: A                          # [sherwin2023]; small blind sample, (a, b) uncertainty propagated (TDD section 4.1 note)
enabled_for_certification: true
observation_mode: snapshot
spatial_scope: site
schedule: orbit
pod:
  pod50_kg_h: 150.0              # Sherwin 2023: GHGSat-C2 detected the smallest release of the campaign, 0.197 [0.187, 0.208] t/h, at 2.0 m/s wind [sherwin2023]
  pod90_kg_h: 300.0              # POD90/POD50 = 2; only 3 valid GHGSat measurements in the test, so (a, b) stay uncertain (ab_cov)
  gamma: 1.0
  u_ref_m_s: 3.0
  ab_cov: [[0.25, -0.04], [-0.04, 0.01]]   # ASSUMPTION standing in for the Laplace posterior until fitted (TDD section 4.1 sample-size note)
  surface_adjustment: {enabled: true, rho_ref: 0.30, rho_p10: 0.12, phi_at_p10: 0.5, uncertainty_halfwidth: 0.5}
  citations: [sherwin2023]
  provenance: {status: summary, basis: "Sherwin et al. 2023: smallest detection 0.197 t/h quantified to within 13 %; 3 valid measurements only"}
quantification:
  ratio_95_low: 0.32
  ratio_95_high: 2.10
  tier: A
  citations: [sherwin2023]
  provenance: {status: summary, basis: "Sherwin 2023 stage 1 (modelled wind): estimates between -68 % and +110 % of metered; slope 0.855 [0.715, 0.995]; 75 % within +/-50 %"}
false_positive:
  rate_per_opportunity: 0.02
  reported_rate_quantile_max: 0.25
  citations: [sherwin2023]
  provenance: {status: assumption, basis: "Sherwin 2023: no false positives (one zero release); 2 % per scene kept as a field allowance"}
constraints:
  max_wind_m_s: 8.0
  max_solar_zenith_deg: 70.0     # TDD section 5.2
  max_cloud_fraction: null       # cloud gate is the Bernoulli draw on p_cloud (TDD section 5.2)
  day_only: true
orbit:
  tle_name: GHGSAT-C2            # CelesTrak name, confirmed 2026-09-30 [celestrak]
  norad_id: 47509                # confirmed from CelesTrak 2026-09-30 [celestrak]
  swath_km: 12.0
  tasked: true
  local_time_desc: "~10:30 descending (sun-synchronous)"
  citations: [celestrak, sherwin2023, ghgsat-c1-spec]
  fov_along_km: 12.0             # scene approx. 12 km x 12 km (WAF-P staring imager) [ghgsat-c1-spec]
  fov_cross_km: 12.0
  max_off_nadir_deg: 15.0        # sensor pointing +/- 15 deg from nadir along & cross-track [ghgsat-c1-spec]; altitude from the TLE
  provenance: {status: summary, basis: "ESA/CSA GHGSat-C1 product specification: FOV ~12 x 12 km, pointing +/-15 deg, 500 km SSO"}
cost:
  per_site_visit_usd: null
  per_tasking_usd: 3000.0        # TODO(verify) [cost-assumptions]
  per_site_year_usd: null
  citations: [cost-assumptions]
  provenance: {status: assumption, basis: "analyst placeholder per tasked scene"}
