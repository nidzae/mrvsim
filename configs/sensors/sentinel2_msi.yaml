key: sentinel2_msi
name: Sentinel-2 MSI (wall-to-wall multispectral, methane via SWIR band ratio)
class: satellite
tier: A                          # [sherwin2023]
enabled_for_certification: true
observation_mode: snapshot
spatial_scope: site
schedule: orbit
pod:
  pod50_kg_h: 1000.0             # Sherwin 2023: 3 of 4 Sentinel-2 teams detected the smallest release, 1.4 [1.3, 1.5] t/h (wind 4.3 m/s); all teams detected ~4 t/h [sherwin2023]
  pod90_kg_h: 2500.0             # POD90/POD50 = 2
  gamma: 1.0
  u_ref_m_s: 3.0
  ab_cov: [[0.3, -0.04], [-0.04, 0.008]]   # ASSUMPTION; see ghgsat_c
  surface_adjustment: {enabled: true, rho_ref: 0.30, rho_p10: 0.12, phi_at_p10: 0.5, uncertainty_halfwidth: 0.5}
  citations: [sherwin2023]
  provenance: {status: summary, basis: "Sherwin 2023: 1.4 t/h detected by 3 of 4 teams; ~4 t/h detected by all; no release below 1.4 t/h was offered to Sentinel-2"}
quantification:
  ratio_95_low: 0.32
  ratio_95_high: 2.10
  tier: A
  citations: [sherwin2023]
  provenance: {status: summary, basis: "Sherwin 2023 stage 1: -68 % to +110 %; slope 0.855"}
false_positive:
  rate_per_opportunity: 0.03
  reported_rate_quantile_max: 0.25
  citations: [sherwin2023]
  provenance: {status: assumption, basis: "3 % per scene assumed for band-ratio retrievals over heterogeneous surfaces"}
constraints:
  max_wind_m_s: 8.0
  max_solar_zenith_deg: 70.0
  max_cloud_fraction: null
  day_only: true
orbit:
  tle_name: SENTINEL-2A          # a second file for 2B doubles revisit; both are wall-to-wall
  norad_id: 40697
  swath_km: 290.0
  tasked: false
  local_time_desc: "10:30 descending"
  citations: [celestrak]
cost:
  per_site_visit_usd: null
  per_tasking_usd: null
  per_site_year_usd: 20.0        # free data; analysis cost only [cost-assumptions]
  citations: [cost-assumptions]
  provenance: {status: assumption, basis: "open data; nominal processing cost per site-year"}
