key: aviris_ng_gao
name: AVIRIS-NG / Global Airborne Observatory imaging spectrometer (aircraft)
class: aircraft
tier: A                          # [elabbadi2024; ayasse2024]
enabled_for_certification: true
observation_mode: snapshot
spatial_scope: site
schedule: campaign
pod:
  pod50_kg_h: 8.5                # El Abbadi 2024 (Carbon Mapper, 82 filtered releases): largest missed 6.61 kg/h, smallest detected 10.92 kg/h,
  pod90_kg_h: 12.0               #   "consistently quantified releases above 10 kg/h" [elabbadi2024]; Cusworth 2022: sources as low as 5-10 kg/h [cusworth2022]
  gamma: 1.0
  u_ref_m_s: 3.0
  surface_adjustment: {enabled: true, rho_ref: 0.30, rho_p10: 0.12, phi_at_p10: 0.5, uncertainty_halfwidth: 0.5}
  citations: [elabbadi2024, ayasse2024, cusworth2022]
  provenance: {status: summary, basis: "bracketed by El Abbadi 2024's largest missed (6.61 kg/h) and smallest detected (10.92 kg/h) releases at the campaign winds; not a fit to the release table"}
quantification:
  ratio_95_low: 0.35
  ratio_95_high: 2.20
  tier: A
  citations: [elabbadi2024, ayasse2024]
  provenance: {status: summary, basis: "El Abbadi 2024 parity slope 0.89 with R^2 0.61 (71 estimates), the loosest of the imaging spectrometers; spread widened to -65 %/+120 %"}
false_positive:
  rate_per_opportunity: 0.01
  reported_rate_quantile_max: 0.25
  citations: [elabbadi2024]
  provenance: {status: assumption, basis: "1 % per site pass assumed"}
constraints:
  max_wind_m_s: 10.0
  max_solar_zenith_deg: null
  max_cloud_fraction: 0.6
  day_only: true
cost:
  per_site_visit_usd: 300.0      # TODO(verify) [cost-assumptions]; wide swath lowers per-site cost
  per_tasking_usd: null
  per_site_year_usd: null
  citations: [cost-assumptions]
  provenance: {status: assumption, basis: "analyst placeholder"}
