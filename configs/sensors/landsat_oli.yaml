key: landsat_oli
name: Landsat 8/9 OLI (wall-to-wall multispectral)
class: satellite
tier: A                          # [sherwin2023]
enabled_for_certification: true
observation_mode: snapshot
spatial_scope: site
schedule: orbit
pod:
  pod50_kg_h: 1500.0             # Sherwin 2023 tested Landsat 8 (wind 4.0 m/s) but reports no Landsat-specific threshold; set 1.5x Sentinel-2 (coarser SWIR band). TODO(verify)
  pod90_kg_h: 3500.0
  gamma: 1.0
  u_ref_m_s: 3.0
  ab_cov: [[0.3, -0.04], [-0.04, 0.008]]   # ASSUMPTION
  surface_adjustment: {enabled: true, rho_ref: 0.30, rho_p10: 0.12, phi_at_p10: 0.5, uncertainty_halfwidth: 0.5}
  citations: [sherwin2023]
  provenance: {status: summary, basis: "recalled from Sherwin 2023; replace with fit"}
quantification:
  ratio_95_low: 0.32
  ratio_95_high: 2.10
  tier: A
  citations: [sherwin2023]
  provenance: {status: summary, basis: "Sherwin 2023 stage 1 pooled satellite error: -68 % to +110 %"}
false_positive:
  rate_per_opportunity: 0.03
  reported_rate_quantile_max: 0.25
  citations: [sherwin2023]
