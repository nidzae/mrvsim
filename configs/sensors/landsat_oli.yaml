constraints:
  max_wind_m_s: 8.0
  max_solar_zenith_deg: 70.0
  max_cloud_fraction: null
  day_only: true
orbit:
  tle_name: LANDSAT 9
  norad_id: 49260
  swath_km: 185.0
  tasked: false
  local_time_desc: "10:00 descending"
