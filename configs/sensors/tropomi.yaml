key: tropomi
name: Sentinel-5P TROPOMI (daily wall-to-wall, 5.5 x 7 km)
class: satellite
tier: B                          # detection statistics only, no blind test possible at this scale (TDD section 4 table) [schuit2023; lauvaux2022]
enabled_for_certification: false
observation_mode: snapshot
spatial_scope: site              # a facility total, but at pixel scale it aggregates neighbours; handled as site-level in v1
schedule: orbit
pod:
  pod50_kg_h: 6000.0             # Schuit 2023: "point source detection limit down to ~5 t/h under favorable conditions"; detected
  pod90_kg_h: 10000.0            #   plumes in 2021 had a 5th percentile of 8 t/h (mean 44 t/h) [schuit2023]. At u_ref = 3 m/s, gamma = 1.
                                 # Supersedes the 2.5/5 t/h values pinned by the original Phase 3 acceptance test (DECISION_LOG 2026-10-01).
  gamma: 1.0
  u_ref_m_s: 3.0
  surface_adjustment: {enabled: false}   # coarse pixels; surface albedo effects folded into the detection statistics
  citations: [schuit2023, lauvaux2022, jacob2022]
  provenance: {status: summary, basis: "Schuit et al. 2023 detection limit statement (~5 t/h favourable) and detected-rate 5th percentile (8 t/h); no controlled release exists at this scale"}
quantification:
  ratio_95_low: 0.50
  ratio_95_high: 2.00
  tier: B
  citations: [schuit2023, lauvaux2022]
  provenance: {status: summary, basis: "Schuit 2023 IME method with ensemble-based uncertainty; factor-of-2 spread assumed (ensemble SD not tabulated)"}
false_positive:
  rate_per_opportunity: 0.005
  reported_rate_quantile_max: 0.25
  citations: [schuit2023]
  provenance: {status: assumption, basis: "0.5 % per pixel-day after plume screening assumed"}
constraints:
  max_wind_m_s: 10.0
  max_solar_zenith_deg: 70.0
  max_cloud_fraction: null
  day_only: true
orbit:
  tle_name: SENTINEL-5P
  norad_id: 42969
  swath_km: 2600.0
  tasked: false
  local_time_desc: "13:30 ascending"
  citations: [celestrak]
cost:
  per_site_visit_usd: null
  per_tasking_usd: null
  per_site_year_usd: 5.0
  citations: [cost-assumptions]
  provenance: {status: assumption, basis: "open data; nominal processing cost"}
