x_ch4_log_sd: 0.05                        # TDD section 3.5
gas_hhv_mj_per_m3: 38.6                   # ~1,037 Btu/scf gross heat content of marketed gas; TODO(verify) [eia-heat-content]
oil_mj_per_bbl: 6119.0                    # 5.8 MMBtu/bbl crude; TODO(verify) [eia-heat-content]
mmbtu_per_mj: 0.000947817                 # 1 MJ = 947.817 Btu (exact unit conversion)
completeness_threshold_kg_h: 10.0         # PRD section 5.5 [jacob2022]
