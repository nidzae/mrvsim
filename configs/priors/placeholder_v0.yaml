# Stratum hyperparameters for the population generator (TDD sections 3.2-3.6) and
# the estimator's empirical-Bayes priors (TDD section 6.2).
#
# provenance: PLACEHOLDER
#   None of these numbers is fitted. They are order-of-magnitude values chosen so
#   the generator runs end to end and unit tests can check distribution *shapes*.
#   Validation tests V1-V7 refuse to run against this file (CLAUDE.md Phase 1).
#   Each block names the sources the fitted replacement must come from; the fitting
#   scripts (data/scripts/) write configs/priors/fitted_<date>.yaml with
#   provenance: FITTED and a fit_provenance record.
#
# Parameter meanings (all rates in kg/h, durations in hours, logs natural):
#   lambda_k        Poisson mean of extra sources; K = Poisson(lambda_k) + 1  [sherwin2024; rutherford2021]
#   p_intermittent  Bernoulli probability a source is intermittent (z = 1)     [cusworth2022; duren2019]
#   mu_0, sigma_0   ln q for steady sources                                     [rutherford2021; sherwin2024]
#   mu_1, sigma_1   ln q for intermittent sources (higher than steady)          [cusworth2022]
#   q_tail, alpha   Pareto splice point and tail index                          [cusworth2022; sherwin2024]
#   nu_on, tau_on   ln D_on                                                     [daniels2023; cms-duration-2024]
#   nu_off, tau_off ln D_off; duty cycle pi = E[D_on] / (E[D_on] + E[D_off])   [duren2019; cusworth2022]
#   throughput      ln V_gas,mkt (m3/yr) and ln oil (bbl/yr) per basin x type   [ghgrp; state-production-data]
provenance: PLACEHOLDER
version: v0
fit_provenance: null

defaults:
  lambda_k: 2.0
  p_intermittent: 0.4
  mu_0: 0.0          # ln(1 kg/h)
  sigma_0: 1.5
  mu_1: 2.3          # ln(10 kg/h)
  sigma_1: 1.3
  q_tail: 100.0
  alpha: 1.5
  nu_on: 2.0         # ln(7.4 h)
  tau_on: 1.0
  nu_off: 4.5        # ln(90 h)
  tau_off: 1.0
  throughput:
    ln_gas_m3_yr_mu: 15.0     # ~3.3e6 m3/yr
    ln_gas_m3_yr_sigma: 1.2
    ln_oil_bbl_yr_mu: 9.0     # ~8,100 bbl/yr
    ln_oil_bbl_yr_sigma: 1.5

# Overrides by facility type, then by basin (basin overrides win). Only the keys
# listed are replaced; the rest come from defaults.
facility_types:
  wp_oil:
    throughput: {ln_gas_m3_yr_mu: 13.5, ln_oil_bbl_yr_mu: 10.0}
  wp_gas:
    throughput: {ln_gas_m3_yr_mu: 16.0, ln_oil_bbl_yr_mu: 5.0, ln_oil_bbl_yr_sigma: 2.0}
  wp_mixed:
    throughput: {ln_gas_m3_yr_mu: 15.0, ln_oil_bbl_yr_mu: 9.0}
  gathering:
    lambda_k: 3.0
    mu_0: 1.0
    throughput: {ln_gas_m3_yr_mu: 18.5, ln_gas_m3_yr_sigma: 1.0, ln_oil_bbl_yr_mu: 0.0, ln_oil_bbl_yr_sigma: 0.1}
  processing:
    lambda_k: 4.0
    mu_0: 1.5
    throughput: {ln_gas_m3_yr_mu: 20.5, ln_gas_m3_yr_sigma: 1.0, ln_oil_bbl_yr_mu: 0.0, ln_oil_bbl_yr_sigma: 0.1}
  transmission:
    lambda_k: 3.0
    mu_0: 1.5
    throughput: {ln_gas_m3_yr_mu: 20.0, ln_gas_m3_yr_sigma: 1.0, ln_oil_bbl_yr_mu: 0.0, ln_oil_bbl_yr_sigma: 0.1}
  storage:
    lambda_k: 3.0
    mu_0: 1.5
    throughput: {ln_gas_m3_yr_mu: 19.5, ln_gas_m3_yr_sigma: 1.0, ln_oil_bbl_yr_mu: 0.0, ln_oil_bbl_yr_sigma: 0.1}

basins:
  permian:     {p_intermittent: 0.45, alpha: 1.4}
  appalachian: {p_intermittent: 0.30, alpha: 1.6}
  haynesville: {p_intermittent: 0.35}
  eagle_ford:  {p_intermittent: 0.40}
  bakken:      {p_intermittent: 0.45}
  dj:          {}
  anadarko:    {}
  san_juan:    {}
  uinta:       {}
  other:       {}

# Observing conditions per basin (TDD section 3.6). PLACEHOLDER until
# data/scripts/fetch_modis_cloud.py and fetch_era5_wind.py write data/fitted/conditions.json.
#   cloud_monthly   daytime cloud fraction, Jan..Dec                             [modis-cloud]
#   wind_weibull_k  Weibull shape of 10 m wind speed                             [era5]
#   wind_weibull_lambda_monthly  Weibull scale (m/s), Jan..Dec                  [era5]
#   surface_reflectance  mean SWIR reflectance; surface_heterogeneity in [0,1]   [landsat-composite]
conditions:
  defaults:
    cloud_monthly: [0.55, 0.55, 0.50, 0.45, 0.45, 0.35, 0.35, 0.35, 0.35, 0.40, 0.50, 0.55]
    wind_weibull_k: 2.0
    wind_weibull_lambda_monthly: [4.5, 4.7, 5.0, 5.2, 4.8, 4.3, 3.9, 3.8, 4.0, 4.3, 4.4, 4.5]
    surface_reflectance: 0.25
    surface_heterogeneity: 0.3
  basins:
    permian:     {cloud_monthly: [0.40, 0.40, 0.35, 0.30, 0.35, 0.30, 0.30, 0.30, 0.30, 0.30, 0.35, 0.40], surface_reflectance: 0.30, surface_heterogeneity: 0.2}
    appalachian: {cloud_monthly: [0.70, 0.65, 0.60, 0.55, 0.55, 0.50, 0.50, 0.50, 0.50, 0.55, 0.65, 0.70], surface_reflectance: 0.15, surface_heterogeneity: 0.6}
    haynesville: {cloud_monthly: [0.60, 0.55, 0.50, 0.45, 0.45, 0.40, 0.40, 0.40, 0.40, 0.45, 0.55, 0.60], surface_reflectance: 0.18, surface_heterogeneity: 0.5}
    bakken:      {cloud_monthly: [0.65, 0.60, 0.55, 0.50, 0.50, 0.45, 0.35, 0.35, 0.40, 0.50, 0.60, 0.65], surface_reflectance: 0.22}
    uinta:       {surface_reflectance: 0.28}
    san_juan:    {surface_reflectance: 0.28}
