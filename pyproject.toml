[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrvsim"
version = "0.0.1"
description = "MRVSim: methane MRV coverage simulator (OSSE) for US onshore oil and gas"
readme = "docs/PRD.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pymc>=5.10",
  "skyfield>=1.46",
  "optuna>=3.4",
  "pyyaml>=6.0",
  "fastapi>=0.100",
  "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.24"]
data = ["requests>=2.31", "shapely>=2.0"]   # data/scripts only (fetching and rebuilding fitted tables)

[tool.setuptools.packages.find]
include = ["mrvsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "validation: validation tests V1-V7 (TDD section 9); skipped against PLACEHOLDER priors",
  "slow: long-running tests",
]
